global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "devflow-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.105:5173"]
      

  # When Prometheus runs in Docker while the backend runs directly
  # on Windows/Linux/macOS host, replace the target above with:
  # host.docker.internal:4000
